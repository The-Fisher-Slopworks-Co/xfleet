# The `bun run check` gate, run for you at commit time. `bun install` installs
# the hook (see the `prepare` script); `LEFTHOOK=0 git commit` skips it once.
#
# Whole-project steps stay whole-project — tsc and knip have no meaningful
# partial mode — while oxlint and Prettier only see the staged files. Running
# in parallel puts the wall clock at the slowest single step rather than
# their sum.
pre-commit:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: lint
      glob: "*.{ts,tsx}"
      run: bunx oxlint {staged_files}

    # Checks rather than rewrites: a hook that edits staged files silently
    # widens a `git add -p` commit to the whole file. Run `bun run format`.
    - name: format
      glob: "*.{ts,tsx,css}"
      run: bunx prettier --check {staged_files}

    - name: knip
      run: bun run knip

    # Whole-tree as well: `reuse lint` also catches a license text that went
    # missing from LICENSES/, which no single staged file shows.
    - name: reuse
      run: bun run reuse

    - name: test
      run: bun run test
