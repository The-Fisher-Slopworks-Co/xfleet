# Everything a pull request runs. Building and publishing the image lives in
# release.yml, which pull requests don't trigger at all.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml
