# `/deploy` on a pull request dispatches pr-preview.yml on its branch. This
# half never checks out PR code; see the org's reusable workflow for why.
name: PR deploy

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  pr-deploy:
    uses: The-Fisher-Slopworks-Co/.github/.github/workflows/pr-deploy.yml@main
